  - {code: S02-2, titre: "Quiz · Itérer et affiner", url: "https://docs.google.com/forms/d/e/1FAIpQLSdh61b_hYSvHpNh40NoutKfp8_RNuTLaGO6NvTjKoh_d-eQFA/viewform"}
  3:
