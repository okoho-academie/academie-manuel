# Calendrier de la cohorte 1 · OKOHO Académie
# SEUL endroit où figurent des dates. Documents et séances restent sans date ni nom de cohorte :
# ils utilisent des variables, remplacées au build (tools/common.py, resolve) :
#   {{cohorte}} {{groupe}} {{jour}} {{nb_semaines}} {{debut}} {{fin}} {{date:SNN}} {{calendrier}} {{jalons}}
# Sans cohorte (parcours en autonomie), chaque variable prend un texte neutre.
# Nouvelle cohorte : copier ce fichier en cohorte-N.yaml, changer dates et noms, lancer tools/build.py.
#
# Nommage Drive : dossier "Semaine NN · JJ.MM.AAAA · Thème", fichier "SNN-ordre · Type · Code Titre",
# livrable "SNN-ordre_Prenom.ext". Types : Guide, À remplir, Séance en direct, En autonomie.
cohorte: 1
nom: "OKOHO Parcours Claude Pro · Cohorte 1"
groupe: "OKOHO Parcours Claude Pro · Cohorte 1"   # nom du groupe WhatsApp d'entraide
jour: samedi                 # jour des séances en direct
horaire: "17 h 00 à 18 h 30 (heure d'Allemagne, identique à l'heure du Cameroun en hiver)"   # décidé le 07.11, à reprendre dans chaque annonce
# Liens publics des formulaires (uniquement /viewform : la page à remplir, jamais l'éditeur).
# Source de la fiche « Quiz de la semaine » de chaque dossier semaine (tools/build_drive.py).
# Les formulaires eux-mêmes restent dans « Formateur (privé) », jamais dans l'Espace participants.
ressources: [A00-04, A00-05, A00-06]   # guides complémentaires, publiés dans « 05 · Ressources et liens utiles »
formulaires:
  0:
  - {code: S00-1, titre: "Quiz · Bien démarrer", url: "https://docs.google.com/forms/d/e/1FAIpQLSe1346xbgY91I_4iJOr-gzlPIGEB75v7oJ755s95Rd_Tb9SNw/viewform"}
