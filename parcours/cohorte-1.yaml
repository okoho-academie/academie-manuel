  - {code: S01-2, titre: "Quiz · Photos et fichiers", url: "https://docs.google.com/forms/d/e/1FAIpQLSeHv-pdIWSLnGKrVvH749ODf62W2rVrHq_BalAoAcgnuvi-kw/viewform"}
