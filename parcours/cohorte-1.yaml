  - {code: S00-3, titre: "Quiz · La carte de Claude", url: "https://docs.google.com/forms/d/e/1FAIpQLSefeXKQ4mRQZDLWAYlzfYArHk-JAu9SsQbEnRO7wxO60sm8Yw/viewform"}
  1:
