# Calendrier de la cohorte 1 · OKOHO Académie
# SEUL endroit où figurent des dates. Documents et séances restent sans date ni nom de cohorte :
# ils utilisent des variables, remplacées au build (tools/common.py, resolve) :
#   {{cohorte}} {{groupe}} {{jour}} {{nb_semaines}} {{debut}} {{fin}} {{date:SNN}} {{calendrier}} {{jalons}}
# Sans cohorte (parcours en autonomie), chaque variable prend un texte neutre.
# Nouvelle cohorte : copier ce fichier en cohorte-N.yaml, changer dates et noms, lancer tools/build.py.
#
# Nommage Drive : dossier "Semaine NN · JJ.MM.AAAA · Thème", fichier "SNN-ordre · Type · Code Titre",
# livrable "SNN-ordre_Prenom.ext". Types : Guide, À remplir, Séance en direct, En autonomie.
cohorte: 1
nom: "Cohorte 1"
groupe: "Cohorte 1"          # nom du groupe WhatsApp d'entraide
jour: samedi                 # jour des séances en direct
programme:
  code: A00-00
  nom_drive: "Programme et calendrier · Cohorte 1"
cycles:
  1: "Je maîtrise Claude et je publie"
  2: "Je produis pour mon client pilote"
  3: "Je me spécialise"
  4: "J'automatise et je construis"
  5: "Nous livrons"
pauses:
  - {apres: 7, dates: ["2026-12-26", "2027-01-02"], note: "Pas de séance. Révision avec NotebookLM"}
  - {apres: 18, dates: ["2027-03-27"], note: "Pas de séance"}
semaines:
