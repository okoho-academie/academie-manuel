code: A00-01
titre: "Quiz · Bien démarrer"
description: "5 questions sur vos comptes et la sécurité. Votre score s'affiche à la fin."
questions:
  - q: "Un participant vous demande votre code de vérification reçu par SMS pour vous aider. Que faites-vous ?"
    choix: ["Je l'envoie dans le groupe WhatsApp", "Je ne le partage jamais, même avec le formateur", "Je l'envoie en message privé"]
    bonne: 1
    explication: "Un code de vérification ne se partage jamais. C'est la clé de votre compte."
  - q: "Comment vérifiez-vous que l'application Claude est la bonne ?"
    choix: ["L'éditeur est Anthropic", "Elle a beaucoup de téléchargements", "Elle est gratuite"]
    bonne: 0
    explication: "Seule l'application de l'éditeur Anthropic est officielle."
  - q: "Quelle méthode de connexion recommande le parcours ?"
    choix: ["Une adresse e-mail différente pour chaque outil", "Continuer avec Google, avec le même compte partout", "Le compte d'un membre de la famille"]
    bonne: 1
    explication: "Un seul compte Google pour Claude, Drive et NotebookLM : tout reste au même endroit."
  - q: "Où déposez-vous vos livrables chaque semaine ?"
    choix: ["Dans le groupe WhatsApp", "Dans votre portfolio Google Drive", "Par e-mail au formateur"]
    bonne: 1
    explication: "Le portfolio est votre dossier personnel. Vous seul et le formateur le voyez."
  - q: "Comment nommez-vous la capture du premier document de la semaine 0 ?"
    choix: ["capture.png", "S00-1_Prenom.png", "Claude_final.png"]
    bonne: 1
    explication: "Code du document, puis votre prénom : le formateur sait tout de suite à quelle séance appartient votre travail."
