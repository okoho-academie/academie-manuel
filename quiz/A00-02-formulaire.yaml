# Diagnostic d'entrée S00-2 · formulaire Google Forms · même contenu que accueil/A00-02/document.md
code: A00-02
titre: "S00-2 · Diagnostic d'entrée"
description: "20 minutes. Il n'y a pas de bonne ou de mauvaise réponse. Vos réponses restent confidentielles entre vous et OKOHO Académie. Elles servent à adapter le parcours et à créer votre portfolio."
sections:
  - titre: "Partie 1 · Votre situation"
    champs:
      - {type: texte, q: "Prénom", obligatoire: true}
      - {type: texte, q: "Nom", obligatoire: true}
      - {type: texte, q: "Adresse Gmail (pour votre portfolio Google Drive)", obligatoire: true, format: gmail, aide: "Exemple : prenom.nom@gmail.com. Sans adresse Gmail, Google Drive ne peut pas ouvrir votre portfolio."}
      - {type: texte, q: "Ville et quartier", obligatoire: true}
      - {type: texte, q: "Activité actuelle", aide: "Études, emploi, commerce, recherche d'emploi…", obligatoire: true}
      - {type: texte, q: "Appareil principal (marque et modèle du téléphone)", obligatoire: true}
      - {type: choix, q: "Avez-vous un ordinateur ?", choix: ["Oui, un ordinateur portable", "Oui, un ordinateur de bureau", "Non, pas encore"], obligatoire: true}
      - {type: choix, q: "Votre connexion Internet", choix: ["Wi-Fi", "Forfait mobile", "Les deux"], obligatoire: true}
      - {type: echelle, q: "Qualité habituelle de votre connexion", min: 1, max: 5, bas: "très mauvaise", haut: "très bonne", obligatoire: true}
      - {type: texte, q: "Langues de travail", obligatoire: false}
      - {type: choix, q: "Disponibilité chaque semaine en dehors de la séance", choix: ["Moins de 2 heures", "2 à 4 heures", "Plus de 4 heures"], obligatoire: true}
  - titre: "Partie 2 · Votre expérience"
    champs:
      - {type: cases, q: "Cochez ce qui est vrai pour vous", choix: ["J'ai déjà utilisé une intelligence artificielle (Claude, ChatGPT, Gemini ou autre)", "J'utilise WhatsApp Business ou une page Facebook pour une activité", "J'ai déjà créé un document avec Word ou Google Docs", "J'ai déjà utilisé un tableur (Excel ou Google Sheets)", "J'ai déjà créé un site web ou une page en ligne", "J'ai déjà travaillé pour un client (même sans facture)"], obligatoire: false}
  - titre: "Partie 3 · Vos objectifs"
    champs:
      - {type: paragraphe, q: "Pourquoi suivez-vous ce parcours ? (trois phrases maximum)", obligatoire: true}
      - {type: paragraphe, q: "Quel projet aimeriez-vous réaliser pour vous-même (privé ou professionnel) ?", obligatoire: true}
      - {type: paragraphe, q: "Pour quelle personne ou entreprise de votre entourage aimeriez-vous travailler pendant le parcours (votre « client pilote ») ? Indiquez son activité.", obligatoire: false}
      - {type: grille, q: "Quel domaine vous attire le plus ? (1 = le plus, 4 = le moins)", lignes: ["Sites web et design", "Contenus et marketing", "Documents, données et conseil", "Automatisation et développement"], colonnes: ["1", "2", "3", "4"], obligatoire: true}
  - titre: "Partie 4 · Mini-tâche avec Claude"
    texte: "Ouvrez Claude et copiez cette consigne en remplaçant les crochets : « Je suis [votre activité] à [votre ville]. Pose-moi cinq questions courtes pour comprendre mon activité. Ensuite, propose-moi trois façons concrètes dont tu peux m'aider cette semaine. » Répondez aux questions de Claude, puis revenez ici."
    champs:
      - {type: paragraphe, q: "La proposition de Claude que vous trouvez la plus utile", obligatoire: true}
      - {type: paragraphe, q: "Ce qui vous a surpris", obligatoire: false}
      - {type: paragraphe, q: "Ce qui n'était pas juste ou pas adapté à votre situation", obligatoire: false}
  - titre: "Partie 5 · Votre engagement"
    champs:
      - {type: paragraphe, q: "Complétez la phrase : « À la fin du parcours, je serai capable de … »", obligatoire: true}
